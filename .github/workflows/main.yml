name: CI/CD – Application with Docker

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  build-test-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history for better caching/context

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      # 8. Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Extract metadata
#      - name: Extract metadata
#        id: meta
#        uses: docker/metadata-action@v5
#         with:
#           images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
#           tags: |
#              type=semver,pattern={{version}}
#              type=semver,pattern={{major}}.{{minor}}
#              type=sha,prefix=sha-
#              type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
#        run: |
#           echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
#           echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 9. Build and push prod image
      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vite
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:${{ steps.meta.outputs.SHORT_SHA }}
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:0.1.${{ github.run_number }}
#            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:latest
          #cache-from: type=local,src=/tmp/.buildx-cache
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:latest
          cache-to: type=inline,mode=min

      # 7. copy docker compose to tov
      - name: Copy files via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "."

      # 8. ssh to tov & docker-compose pull
      - name: Deploy with SSH Action
        uses: appleboy/ssh-action@v1.0.0
        env:
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          QBO_CLIENT_ID: ${{ secrets.QBO_CLIENT_ID }}
          QBO_CLIENT_SECRET: ${{ secrets.QBO_CLIENT_SECRET }}
          QBO_REDIRECT_URI: ${{ secrets.QBO_REDIRECT_URI }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FOO: "this is foo"
          VERSION: 0.1.${{ github.run_number }}

        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          allenvs: "true"
          envs: DATABASE_PASSWORD,QBO_CLIENT_SECRET,QBO_CLIENT_ID,QBO_REDIRECT_URI,EMAIL_USERNAME,EMAIL_PASSWORD,VERSION
          script: |
            touch i-was-here.txt
            set > i-was-here.txt
            docker compose pull
            docker compose run --rm minibini_django python manage.py migrate
            docker compose run --rm minibini_django python manage.py loaddata fixtures/large_datasets/nealsmall.json
            docker compose up -d --pull always  minibini_django
            docker compose up -d --pull always  minibini_vite
            docker compose restart -d --pull always  cron
      # 9. send shannon email if the action fails
      - name: email shannon on failure
        uses: dawidd6/action-send-mail@v3.6.0
        if: failure()
        with:
          # mail server settings
          server_address: smtp.gmail.com
          server_port: 465
          # user credentials
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          # email subject
          subject: ${{ github.job }} job of ${{ github.repository }} has ${{ job.status }}
          # email body as text
          body: ${{ github.job }} job in worflow ${{ github.workflow }} of ${{ github.repository }} has ${{ job.status }}
          # comma-separated string, send email to
          to: Shannon Lee <shannon@turkshead.org>
          # from email name
          from: Jidōhanbaiki <minibini.test@gmail.com>



