server {
    listen 80;
    server_name minibini.me;
    location / {
      return 301 https://$host$request_uri;
    }
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;  # Root directory for Certbot challenges
    }
}

server {
    listen 443 ssl;
    server_name minibini.me;

    ssl_certificate /etc/letsencrypt/live/minibini.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minibini.me/privkey.pem;

    location / {
	
	auth_basic "Go Away";
	auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
	satisfy any;

        proxy_pass http://minibini-vite:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

upstream backend_servers {
  server minibini-vite:9000;
  # Other optional parameters like 'weight', 'backup', 'down', etc.
}
