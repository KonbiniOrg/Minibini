services:
  # minibini_django:
  minibini_vite:
    container_name: minibini-vite
    image: ashannonlee/minibini
    environment:
      - MYSQL_ROOT_PASSWORD=Ru5UPhae
      - DATABASE_NAME=minibini_db
      - DATABASE_USER=minidb_user
      - DATABASE_PASSWORD=Ru5UPhae
      - DATABASE_HOST=mysql
      - MINIBINI_VERSION=${VERSION}
    build:
      context: .
      dockerfile: Dockerfile.vite
    #volumes:
    #  - '/home/slee/git/konbini/Minibini:/minibini'
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
  minibini_django:
    container_name: minibini-django
    image: ashannonlee/minibini
    environment:
      - MYSQL_ROOT_PASSWORD=Ru5UPhae
      - DATABASE_NAME=minibini_db
      - DATABASE_USER=minidb_user
      - DATABASE_PASSWORD=Ru5UPhae
      - DATABASE_HOST=mysql
      - QBO_CLIENT_ID=ABZGwDsviVlpwQmS5qemO2Edt3rSHpRzJyE9ooKkQhM6dq0wGV
      - QBO_CLIENT_SECRET=HoBe9JobfydrPJVAQbJy6F25NUY3mZXHHXFxZ48u
      - QBO_REDIRECT_URI=https://minibini.me/api/qbo/callback/
      - QBO_ENVIRONMENT=sandbox
      - SPA_BASE_URL=http://minibini.me/
      - EMAIL_HOST_USER=minibini.test@gmail.com
      - EMAIL_HOST_PASSWORD=ttsg buza hxik ibit
      - MINIBINI_VERSION=0.1.${GITHUB_RUN_NUMBER}
    build:
      context: .
      dockerfile: Dockerfile.django
    labels:
      ofelia.enabled: "true"
    #volumes:
    #  - '/home/slee/git/konbini/Minibini:/minibini'
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:9000
  cron:
    container_name: ofelia_cron
    image: mcuadros/ofelia:latest
    environment:
      - MYSQL_ROOT_PASSWORD=Ru5UPhae
      - DATABASE_NAME=minibini_db
      - DATABASE_USER=minidb_user
      - DATABASE_PASSWORD=Ru5UPhae
      - DATABASE_HOST=mysql
      - QBO_CLIENT_ID=ABZGwDsviVlpwQmS5qemO2Edt3rSHpRzJyE9ooKkQhM6dq0wGV
      - QBO_CLIENT_SECRET=HoBe9JobfydrPJVAQbJy6F25NUY3mZXHHXFxZ48u
      - QBO_REDIRECT_URI=https://minibini.me/api/qbo/callback/
      - QBO_ENVIRONMENT=sandbox
      - SPA_BASE_URL=http://minibini.me/
      - EMAIL_HOST_USER=minibini.test@gmail.com
      - EMAIL_HOST_PASSWORD=ttsg buza hxik ibit
      - MINIBINI_VERSION=0.1.${GITHUB_RUN_NUMBER}
    # Point the daemon explicitly to the mounted config file
    command: daemon --config /etc/ofelia/config.ini
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/cron/ofelia.ini:/etc/ofelia/config.ini:ro
    restart: unless-stopped
#  cron:
#    container_name: minibini-cron
#    image: ashannonlee/minibini
#    build: .
#    environment:
#      - MYSQL_ROOT_PASSWORD=Ru5UPhae
#      - DATABASE_NAME=minibini_db
#      - DATABASE_USER=minidb_user
#      - DATABASE_PASSWORD=Ru5UPhae
#      - DATABASE_HOST=mysql
#    command: ["/app/deploy/cron/entrypoint.sh"]
#    restart: always
#    depends_on:
#      mysql:
#        condition: service_healthy
#        restart: true
  mysql:
    container_name: mysql
    image: mariadb:latest
    environment:
      - MYSQL_ROOT_PASSWORD=Ru5UPhae
      - MARIADB_DATABASE=minibini_db
      - MARIADB_USER=minidb_user
      - MARIADB_PASSWORD=Ru5UPhae
    ports:
      - '3306:3306'
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s # Gives time for initial setup

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - certbot
      - minibini_django
      - minibini_vite

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

