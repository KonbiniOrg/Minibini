services:
  # minibini_django:
  minibini_vite:
    container_name: minibini-vite
    image: ashannonlee/minibini
    environment:
      - MYSQL_ROOT_PASSWORD=Ru5UPhae
      - DATABASE_NAME=minibini_db
      - DATABASE_USER=minidb_user
      - DATABASE_PASSWORD=Ru5UPhae
      - DATABASE_HOST=mysql
    build:
      context: .
      dockerfile: Dockerfile.vite
    #volumes:
    #  - '/home/slee/git/konbini/Minibini:/minibini'
    ports:
      - '9000:9000'
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
  minibini_django:
    container_name: minibini-django
    image: ashannonlee/minibini
    environment:
      - MYSQL_ROOT_PASSWORD=Ru5UPhae
      - DATABASE_NAME=minibini_db
      - DATABASE_USER=minidb_user
      - DATABASE_PASSWORD=Ru5UPhae
      - DATABASE_HOST=mysql
    build:
      context: .
      dockerfile: Dockerfile.django
    #volumes:
    #  - '/home/slee/git/konbini/Minibini:/minibini'
    ports:
      - '9000:9000'
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:9000
#  cron:
#    container_name: minibini-cron
#    image: ashannonlee/minibini
#    build: .
#    environment:
#      - MYSQL_ROOT_PASSWORD=Ru5UPhae
#      - DATABASE_NAME=minibini_db
#      - DATABASE_USER=minidb_user
#      - DATABASE_PASSWORD=Ru5UPhae
#      - DATABASE_HOST=mysql
#    command: ["/app/deploy/cron/entrypoint.sh"]
#    restart: always
#    depends_on:
#      mysql:
#        condition: service_healthy
#        restart: true
  mysql:
    container_name: mysql
    image: mariadb:latest
    environment:
      - MYSQL_ROOT_PASSWORD=Ru5UPhae
      - MARIADB_DATABASE=minibini_db
      - MARIADB_USER=minidb_user
      - MARIADB_PASSWORD=Ru5UPhae
    ports:
      - '3306:3306'
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s # Gives time for initial setup

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - certbot
      - minibini_django
      - minibini_vite

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

