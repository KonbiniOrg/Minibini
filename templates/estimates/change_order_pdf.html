<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: sans-serif; font-size: 12px; margin: 40px; }
        h1 { font-size: 18px; margin-bottom: 5px; }
        h2 { font-size: 14px; color: #555; margin-top: 0; }
        h3 { font-size: 13px; margin: 22px 0 0; }
        table.lines { width: 100%; border-collapse: collapse; margin-top: 6px; }
        table.lines th, table.lines td { border: 1px solid #333; padding: 6px 8px; text-align: left; }
        table.lines th { background-color: #eee; }
        table.lines td.amount { text-align: right; }
        .total-row td { border-top: 2px solid #333; }
        .total-row.grand td { font-weight: bold; }
        .header-info { margin: 0; }
        .header-info p { margin: 2px 0; }
        .preserve-breaks { white-space: pre-wrap; overflow-wrap: anywhere; }
        .change-col { white-space: nowrap; font-size: 11px; }
        tr.added { background-color: #e9f7ee; }
        tr.changed { background-color: #fdf6ec; }
        tr.removed td, tr.was td { color: #888; text-decoration: line-through; }
        tr.was .change-col { font-style: italic; }
        .intro { color: #444; }
{% include 'pdf/_branding_styles.html' %}    </style>
</head>
<body>
{% include 'pdf/_page_footer.html' %}{% include 'pdf/_layout.html' %}</body>
</html>
