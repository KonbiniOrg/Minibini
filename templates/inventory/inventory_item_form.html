{% extends 'base.html' %}

{% block title %}{{ title }} - Inventory - Minibini{% endblock %}

{% block content %}
<h2>{{ title }}</h2>

<form method="post">
    {% csrf_token %}
    <table>
        {{ form.as_table }}
    </table>
    <br>
    <button type="submit">{{ button_text }}</button>
    <a href="{% url 'inventory:inventory_list' %}">Cancel</a>
</form>

{% endblock %}
