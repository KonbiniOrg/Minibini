{% extends 'base.html' %}

{% block title %}Add Material - {{ task.name }} - Minibini{% endblock %}

{% block content %}
<h2>Add Material to Task: {{ task.name }}</h2>

<form method="post">
    {% csrf_token %}
    <table>
        {{ form.as_table }}
    </table>
    <button type="submit">Add Material</button>
</form>

<p>
    <a href="{% url 'jobs:task_detail' task.pk %}">Cancel</a>
</p>
{% endblock %}
