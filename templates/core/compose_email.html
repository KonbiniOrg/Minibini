{% extends 'base.html' %}
{% block content %}
<h2>Compose Email</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <p><label for="to"><strong>To *</strong></label><br>
        <input type="text" id="to" name="to" value="{{ to|default:'' }}" required
               placeholder="email@example.com, another@example.com"></p>

    <p><label for="cc"><strong>CC</strong></label><br>
        <input type="text" id="cc" name="cc" value="{{ cc|default:'' }}"
               placeholder="Comma-separated emails"></p>

    <p><label for="bcc"><strong>BCC</strong></label><br>
        <input type="text" id="bcc" name="bcc" value="{{ bcc|default:'' }}"
               placeholder="Comma-separated emails"></p>

    <p><label for="subject"><strong>Subject *</strong></label><br>
        <input type="text" id="subject" name="subject" value="{{ subject|default:'' }}" required></p>

    <p><label for="body"><strong>Body</strong></label><br>
        <textarea id="body" name="body" rows="10" cols="60">{{ body|default:'' }}</textarea></p>

    <p><label for="attachments"><strong>Attachments</strong></label><br>
        <input type="file" id="attachments" name="attachments" multiple></p>

    <p><button type="submit">Send</button> <a href="{% url 'core:email_inbox' %}">Cancel</a></p>
</form>
{% endblock %}
